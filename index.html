<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kino XII — Cinema Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="#/" class="logo" data-link>KINO <span>XII</span></a>
      <nav class="nav-links">
        <a href="#/sessions" data-link>SESSIONS</a>
      </nav>
      <div class="nav-search">
        <span class="search-icon">⌕</span>
        <input id="global-search" type="text" placeholder="Search films and live events" autocomplete="off" maxlength="100" />
        <div id="search-results" class="search-results hidden"></div>
      </div>
      <div class="nav-auth" id="nav-auth"></div>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <div class="footer-inner">
      <span class="logo small">KINO <span>XII</span></span>
      <span>© 2026 Kino XII. All rights reserved.</span>
    </div>
  </footer>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <div id="app-error" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:10px 16px;font:13px monospace;z-index:999;white-space:pre-wrap"></div>
  <script>
    window.addEventListener("error", function (e) {
      var b = document.getElementById("app-error");
      if (b) { b.style.display = "block"; b.textContent = "JS error: " + (e.message || e.error) + " @ " + (e.filename || "") + ":" + (e.lineno || ""); }
    });
    window.addEventListener("unhandledrejection", function (e) {
      var b = document.getElementById("app-error");
      if (b) { b.style.display = "block"; b.textContent = "Fetch error: " + (e.reason && e.reason.message || e.reason); }
    });
  </script>
  <script type="module" src="./js/app.js?v=5"></script>
</body>
</html>
